[project]
name = "techshare-api"
version = "0.1.0"
description = "Colby Tech Share Forum API: .docx parsing, sanitization, project storage"
requires-python = ">=3.12,<3.14"
dependencies = [
    "bleach>=6.2",
    "fastapi>=0.121",
    "mammoth>=1.11",
    "markdown-it-py>=4.0",
    "markdownify>=1.2",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.12",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
