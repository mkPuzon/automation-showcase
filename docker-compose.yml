services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automation}
      POSTGRES_DB: ${POSTGRES_DB:-automation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-automation} -d $${POSTGRES_DB:-automation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://automation:automation@db:5432/automation}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      SEED_LOCAL: ${SEED_LOCAL:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    environment:
      ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    depends_on:
      - api

volumes:
  postgres_data:
