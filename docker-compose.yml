services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automation}
      POSTGRES_DB: ${POSTGRES_DB:-automation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-automation} -d $${POSTGRES_DB:-automation}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://automation:automation@db:5432/automation}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      SEED_LOCAL: ${SEED_LOCAL:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173,http://localhost:4173}
      # Empty keeps generated image URLs same-origin through the frontend proxy.
      # Set this to the public API origin when using a separate API domain.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        # Leave empty to use the frontend's same-origin /api proxy.
        # Set VITE_API_URL to a public API origin when using a separate API domain.
        VITE_API_URL: ${VITE_API_URL:-}
    environment:
      INTERNAL_API_URL: http://api:8000
      # Dokploy supplies the public Host and X-Forwarded-Proto headers.
      # Pass through only when set; adapter-node rejects an empty ORIGIN.
      ORIGIN:
      PROTOCOL_HEADER: x-forwarded-proto
      # Allow a 10 MB PDF plus multipart overhead; API validates individual files.
      BODY_SIZE_LIMIT: 12M
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
