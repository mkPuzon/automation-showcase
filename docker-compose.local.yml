services:
  api:
    ports:
      - '8000:8000'
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin}
      SEED_LOCAL: ${SEED_LOCAL:-true}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173,http://localhost:4173}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - '5173:3000'
